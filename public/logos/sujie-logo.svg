<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0926"/>
      <stop offset="50%" stop-color="#150f38"/>
      <stop offset="100%" stop-color="#24144d"/>
    </linearGradient>

    <!-- Speed Violet to Neon Blue Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Electric Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Rings (速界之环 / Speed Realm Orbit) -->
  <g transform="translate(100, 100)">
    <!-- Tilted Velocity Ring -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="url(#speedGrad)" stroke-width="2.5" transform="rotate(-25)" opacity="0.75" filter="url(#speedGlow)"/>
    <ellipse cx="0" cy="0" rx="52" ry="16" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 4" transform="rotate(-25)" opacity="0.5"/>

    <!-- Central "S" Velocity Monogram / Supersonic Warp Wings -->
    <!-- Top Sweeping Wing -->
    <path d="M -36,-16 C -18,-36 12,-40 38,-28 C 44,-24 40,-16 32,-18 C 14,-22 -8,-16 -24,2 Z" fill="url(#speedGrad)" filter="url(#speedGlow)"/>

    <!-- Bottom Sweeping Wing -->
    <path d="M 36,16 C 18,36 -12,40 -38,28 C -44,24 -40,16 -32,18 C -14,22 8,16 24,-2 Z" fill="url(#speedGrad)" filter="url(#speedGlow)"/>

    <!-- Central High-Velocity Bolt / Needle -->
    <polygon points="-4,-32 10,-32 2,-8 14,-8 -10,32 -2,4 -14,4" fill="#FFFFFF" filter="url(#speedGlow)"/>

    <!-- Core Energy Pulse -->
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
  </g>

  <!-- Orbital Cyber Sparks -->
  <polygon points="156,44 159,51 166,53 159,55 156,62 153,55 146,53 153,51" fill="#38BDF8"/>
  <polygon points="42,148 44,153 49,155 44,157 42,162 40,157 35,155 40,153" fill="#C084FC" opacity="0.9"/>
  <circle cx="164" cy="138" r="2.5" fill="#818CF8" opacity="0.75"/>
</svg>
