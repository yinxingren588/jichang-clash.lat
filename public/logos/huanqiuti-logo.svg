<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Neon Cyan to Magenta Gradient (matching Huanqiuti theme) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#F355A3"/>
    </linearGradient>

    <!-- Ladder Step Gold/Cyan Glow -->
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Subtle Aura Glow -->
  <circle cx="100" cy="100" r="58" fill="#4FACFE" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Globe (环球) Grid Lines -->
  <g id="globe" transform="translate(100, 100)">
    <!-- Outer Globe Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.65"/>
    <circle cx="0" cy="0" r="54" fill="#00F2FE" opacity="0.04"/>

    <!-- Globe Longitude Ellipses -->
    <ellipse cx="0" cy="0" rx="26" ry="54" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="44" ry="54" fill="none" stroke="#00F2FE" stroke-width="1.2" opacity="0.25"/>

    <!-- Globe Latitude Lines -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#00F2FE" stroke-width="1.8" opacity="0.5"/>
    <path d="M -46,-26 Q 0,-18 46,-26" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.35"/>
    <path d="M -46,26 Q 0,18 46,26" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.35"/>

    <!-- Ascending Cyber Ladder (梯) -->
    <!-- Left Rail -->
    <line x1="-22" y1="36" x2="-8" y2="-44" stroke="url(#ladderGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Right Rail -->
    <line x1="8" y1="44" x2="22" y2="-36" stroke="url(#ladderGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)"/>

    <!-- Ladder Rungs (Steps ascending into the clouds) -->
    <line x1="-20" y1="28" x2="9" y2="35" stroke="#00F2FE" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-17" y1="12" x2="12" y2="18" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-14" y1="-4" x2="15" y2="2" stroke="#818CF8" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-11" y1="-20" x2="18" y2="-14" stroke="#C084FC" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-8" y1="-36" x2="21" y2="-30" stroke="#F43F5E" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Rising Apex Star / Rocket Launch Spark -->
    <polygon points="6,-46 9,-40 15,-40 10,-36 12,-30 6,-34 0,-30 2,-36 -3,-40 3,-40" fill="#F43F5E" filter="url(#neonGlow)"/>
  </g>

  <!-- Orbital Sparks -->
  <polygon points="156,46 159,53 166,55 159,57 156,64 153,57 146,55 153,53" fill="#00F2FE"/>
  <circle cx="42" cy="148" r="3" fill="#F43F5E" opacity="0.8"/>
  <circle cx="164" cy="138" r="2.5" fill="#38BDF8" opacity="0.7"/>
</svg>
