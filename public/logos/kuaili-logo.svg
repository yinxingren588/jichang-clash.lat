<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Deep Espresso / Amber Black) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c110a"/>
      <stop offset="50%" stop-color="#2a180f"/>
      <stop offset="100%" stop-color="#3d2112"/>
    </linearGradient>

    <!-- Warm Terracotta & Amber Tanuki Gradient -->
    <linearGradient id="tanukiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Tanuki Mask Dark Gradient -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C0A02"/>
    </linearGradient>

    <!-- Golden Speed Glow -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="#EA580C" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Subtle Aura -->
  <circle cx="100" cy="100" r="56" fill="#EA580C" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Concept: Swift Tanuki Face & Supersonic Energy (快狸) -->
  <g id="tanukiAvatar" transform="translate(100, 102)">
    <!-- Ears -->
    <!-- Left Ear -->
    <polygon points="-44,-24 -38,-56 -16,-34" fill="url(#tanukiGrad)"/>
    <polygon points="-40,-26 -36,-50 -20,-34" fill="#FEF3C7"/>

    <!-- Right Ear -->
    <polygon points="44,-24 38,-56 16,-34" fill="url(#tanukiGrad)"/>
    <polygon points="40,-26 36,-50 20,-34" fill="#FEF3C7"/>

    <!-- Head Outline (Cute Raccoon Dog Cheek Fluffs) -->
    <path d="M -44,-10 C -56,8 -50,28 -34,40 C -18,48 18,48 34,40 C 50,28 56,8 44,-10 C 38,-30 -38,-30 -44,-10 Z" fill="url(#tanukiGrad)"/>

    <!-- Tanuki Eye Mask (Dark Brown Patch) -->
    <path d="M -38,4 C -38,18 -20,20 -12,8 C -6,0 6,0 12,8 C 20,20 38,18 38,4 C 38,-10 20,-12 12,-4 C 6,2 -6,2 -12,-4 C -20,-12 -38,-10 -38,4 Z" fill="url(#maskGrad)"/>

    <!-- Cheeks & Muzzle White Patch -->
    <path d="M -14,14 C -18,22 -14,34 0,38 C 14,34 18,22 14,14 C 8,10 -8,10 -14,14 Z" fill="#FEF3C7"/>

    <!-- Sparkling Eyes -->
    <ellipse cx="-22" cy="4" rx="5" ry="7" fill="#FEF08A"/>
    <circle cx="-20" cy="2" r="2.2" fill="#1C0A02"/>
    <circle cx="-23" cy="1" r="1.2" fill="#FFFFFF"/>

    <ellipse cx="22" cy="4" rx="5" ry="7" fill="#FEF08A"/>
    <circle cx="20" cy="2" r="2.2" fill="#1C0A02"/>
    <circle cx="21" cy="1" r="1.2" fill="#FFFFFF"/>

    <!-- Little Cute Nose -->
    <polygon points="0,20 -4,16 4,16" fill="#1C0A02"/>

    <!-- Cute Mouth -->
    <path d="M -5,25 Q 0,28 5,25" fill="none" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>

    <!-- Forehead Lightning Speed Mark (快) -->
    <polygon points="2,-38 -6,-22 0,-22 -7,-8 8,-24 1,-24 7,-38" fill="url(#goldGlow)" filter="url(#softGlow)"/>

    <!-- Whiskers -->
    <line x1="-36" y1="18" x2="-54" y2="14" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-36" y1="24" x2="-52" y2="28" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="36" y1="18" x2="54" y2="14" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="36" y1="24" x2="52" y2="28" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Orbital Cyber Sparks -->
  <polygon points="154,46 157,53 164,55 157,57 154,64 151,57 144,55 151,53" fill="#FDE047"/>
  <circle cx="42" cy="146" r="3" fill="#EA580C" opacity="0.8"/>
  <circle cx="162" cy="138" r="2.5" fill="#FBBF24" opacity="0.75"/>
</svg>
