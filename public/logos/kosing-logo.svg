<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a24"/>
      <stop offset="50%" stop-color="#18123c"/>
      <stop offset="100%" stop-color="#2a1b54"/>
    </linearGradient>

    <!-- Royal Violet / Indigo Gradient (matching Kexinyun UI) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Trust Shield / Checkmark Cyan-to-White Glow -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="#9333EA" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Subtle Aura -->
  <circle cx="100" cy="100" r="58" fill="#9333EA" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Concept: Shield of Trust (可信) & High-speed Cloud (云) -->
  <g transform="translate(100, 96)">
    <!-- Security Trust Shield Outer Frame -->
    <path d="M 0,-52 L 42,-34 C 42,14 26,46 0,60 C -26,46 -42,14 -42,-34 Z" fill="url(#shieldGrad)" stroke="#C084FC" stroke-width="2.5" opacity="0.4" filter="url(#softGlow)"/>

    <!-- Dynamic Cloud base -->
    <path d="M -34,16 C -40,16 -46,11 -46,4 C -46,-3 -40,-9 -34,-9 C -32,-18 -24,-24 -14,-24 C -10,-24 -6,-22 -3,-20 C 2,-28 12,-32 22,-30 C 32,-28 38,-20 38,-10 C 46,-8 52,-1 52,7 C 52,15 45,21 37,21 L -34,21 Z" fill="url(#cloudGrad)" opacity="0.95" filter="url(#softGlow)"/>

    <!-- Trust Checkmark (可信认证勾) -->
    <path d="M -14,-2 L -3,9 L 20,-14" fill="none" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orbital Cyber Sparks -->
  <polygon points="154,46 157,53 164,55 157,57 154,64 151,57 144,55 151,53" fill="#C084FC"/>
  <circle cx="44" cy="146" r="3" fill="#A855F7" opacity="0.8"/>
  <circle cx="160" cy="140" r="2.5" fill="#E9D5FF" opacity="0.7"/>
</svg>
