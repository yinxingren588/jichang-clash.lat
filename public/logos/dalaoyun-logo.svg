<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dalaoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="120" height="120" rx="28" fill="url(#dalaoBg)" filter="url(#glow)" />

  <!-- Inner Soft Highlight -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Cloud Silhouette -->
  <path d="M40 76 h42 a16 16 0 0 0 3-31.7 A22 22 0 0 0 43 40 a17 17 0 0 0 -19 18 A15 15 0 0 0 40 76 z" fill="rgba(255, 255, 255, 0.95)" />

  <!-- Crown on Cloud (大佬特征) -->
  <path d="M48 54 l4 -14 l8 8 l8 -8 l4 14 z" fill="url(#crownGold)" />
  <circle cx="48" cy="40" r="2.5" fill="#f59e0b" />
  <circle cx="60" cy="34" r="3" fill="#f59e0b" />
  <circle cx="72" cy="40" r="2.5" fill="#f59e0b" />

  <!-- Core Speed Bolt (高速专线) -->
  <path d="M62 57 l-7 11 h6 l-3 9 l9 -13 h-6 l4 -7 z" fill="#4f46e5" />
</svg>