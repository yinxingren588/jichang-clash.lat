<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Lightning / Electric Glow Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Mouse Face Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Background energetic pulses -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="100" cy="100" r="48" fill="#0284C7" opacity="0.12" filter="url(#cyanGlow)"/>

  <!-- Mouse Character + Lightning Concept -->
  <g id="mouseAvatar" transform="translate(100, 102)">
    <!-- Ears -->
    <!-- Left Ear -->
    <circle cx="-38" cy="-38" r="24" fill="url(#electricGrad)"/>
    <circle cx="-38" cy="-38" r="15" fill="#0F172A"/>
    <path d="M -44,-42 L -36,-38 L -40,-32" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Right Ear -->
    <circle cx="38" cy="-38" r="24" fill="url(#electricGrad)"/>
    <circle cx="38" cy="-38" r="15" fill="#0F172A"/>
    <path d="M 44,-42 L 36,-38 L 40,-32" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Mouse Face Base -->
    <ellipse cx="0" cy="2" rx="46" ry="42" fill="url(#faceGrad)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Cute Tech Eyes -->
    <ellipse cx="-18" cy="-6" rx="6" ry="9" fill="#38BDF8"/>
    <circle cx="-16" cy="-8" r="2.5" fill="#FFFFFF"/>
    
    <ellipse cx="18" cy="-6" rx="6" ry="9" fill="#38BDF8"/>
    <circle cx="20" cy="-8" r="2.5" fill="#FFFFFF"/>

    <!-- Whiskers -->
    <line x1="-28" y1="8" x2="-50" y2="4" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-28" y1="14" x2="-48" y2="18" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="8" x2="50" y2="4" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="14" x2="48" y2="18" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Tech Nose -->
    <polygon points="0,5 -5,12 5,12" fill="#FACC15"/>

    <!-- Mouth -->
    <path d="M -8,18 Q 0,24 8,18" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Forehead Golden Lightning Bolt -->
    <polygon points="3,-46 -8,-24 -1,-24 -9,-8 9,-26 2,-26 8,-46" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
  </g>

  <!-- Surrounding Speed Sparks -->
  <polygon points="152,42 155,49 162,51 155,53 152,60 149,53 142,51 149,49" fill="#FACC15"/>
  <polygon points="40,146 42,151 47,153 42,155 40,160 38,155 33,153 38,151" fill="#38BDF8" opacity="0.9"/>
  <circle cx="166" cy="136" r="3" fill="#FACC15" opacity="0.75"/>
  <circle cx="34" cy="58" r="2.5" fill="#38BDF8" opacity="0.7"/>
</svg>
